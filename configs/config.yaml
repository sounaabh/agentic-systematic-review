# ---- LLM ----------------------------------------------------------
# provider: ollama | groq | nvidia
llm:
  provider: ollama
  model: qwen2.5:7b            # main model (protocol, adjudication, extraction, synthesis)
  temperature: 0               # 0 = reproducible runs
  num_ctx: 8192                # context window (Ollama only)
  # Screener B uses a different model to simulate an independent second reviewer.
  # Leave empty ("") to reuse the main model with a different prompt (faster).
  screener_b_model: llama3.1:8b
  embedding_model: nomic-embed-text   # for dense retrieval; set "" to use BM25 only

# Examples for other providers:
#   provider: groq    model: llama-3.3-70b-versatile   (needs GROQ_API_KEY in .env)
#   provider: nvidia  model: meta/llama-3.1-70b-instruct (needs NVIDIA_API_KEY)

# ---- Search -------------------------------------------------------
search:
  sources: [openalex, semantic_scholar, arxiv]
  max_results_per_query: 40    # per source, per query
  max_records_to_screen: 150   # cap after deduplication (keeps runs short)
  year_from: 2020

# ---- Full text + RAG ----------------------------------------------
fulltext:
  max_studies: 15              # max included studies to fetch/extract
  chunk_words: 220
  chunk_overlap: 40
  top_k_chunks: 8

# ---- Workflow -----------------------------------------------------
workflow:
  human_in_the_loop: true      # pause for approval after protocol and screening
  max_critic_revisions: 2
  runs_dir: runs
