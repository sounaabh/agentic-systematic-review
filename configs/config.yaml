# Personal LLM settings (provider, models, API keys) go in your own .env file.
# This file holds the shared review settings used for the final runs.

# ---- LLM ----------------------------------------------------------
# provider: ollama | groq | nvidia   (override with LLM_PROVIDER in .env)
llm:
  provider: ollama
  model: qwen2.5:7b            # main model (protocol, adjudication, extraction, synthesis)
  temperature: 0               # 0 = reproducible runs
  num_ctx: 8192                # context window (Ollama only)
  # Screener B uses a different model to simulate an independent second reviewer.
  screener_b_model: llama3.1:8b
  embedding_model: nomic-embed-text   # dense retrieval (Ollama only); "" = BM25 only
  reasoning_effort: low        # Groq gpt-oss models: low | medium | high

# Groq example (.env):  LLM_PROVIDER=groq  LLM_MODEL=openai/gpt-oss-120b
#                       SCREENER_B_MODEL=openai/gpt-oss-20b  EMBEDDING_MODEL=
# Groq free tier: 8K tokens/min and 200K tokens/day per model -> the sizes below
# are chosen so a full run fits in one day's quota.

# ---- Search -------------------------------------------------------
search:
  sources: [openalex, arxiv]   # semantic_scholar is rate-limited without an API key
  max_results_per_query: 25    # per source, per query
  max_records_to_screen: 70    # cap after deduplication
  year_from: 2020

# ---- Full text + RAG ----------------------------------------------
fulltext:
  max_studies: 10              # max included studies to fetch/extract
  chunk_words: 220
  chunk_overlap: 40
  top_k_chunks: 8

# ---- Workflow -----------------------------------------------------
workflow:
  human_in_the_loop: true      # pause for approval after protocol and screening
  max_critic_revisions: 2
  runs_dir: runs
